<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>PintaPost — Negrita y cursiva para publicaciones de LinkedIn</title>
    <meta name="description" content="Editor gratuito para dar formato a tus publicaciones de LinkedIn: negrita, cursiva y listas que sobreviven al pegar. Sin cuenta y sin instalar nada."/>
    <meta name="theme-color" content="#f8f9ff"/>
    <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg"/>

    <!-- Open Graph. Sin og:url ni og:image todavía: el dominio se decide en el
         S07 (C-07) y la imagen social es parte de C-10 completa. -->
    <meta property="og:title" content="PintaPost — Negrita y cursiva para publicaciones de LinkedIn"/>
    <meta property="og:description" content="Editor gratuito para dar formato a tus publicaciones de LinkedIn: negrita, cursiva y listas que sobreviven al pegar. Sin cuenta y sin instalar nada."/>
    <meta property="og:type" content="website"/>
    <meta property="og:locale" content="es_ES"/>
    <!-- Tema aplicado antes de pintar nada: sin esto, cargar en modo oscuro
         produce un destello blanco. Es la excepción acotada de ADR-015 (asigna
         desde JS en runtime, no declara estilo en el marcado). -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('pintapost:theme');
                var dark = stored === 'dark' || (stored !== 'light'
                    && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
                // Los dos valores son el token --background de styles.css.
                document.querySelector('meta[name="theme-color"]')
                    .setAttribute('content', dark ? '#0b1420' : '#f8f9ff');
            } catch (e) {
                // Almacenamiento bloqueado: se queda en claro, sin romper nada.
            }
        })();
    </script>
    <link rel="preload" href="/static/assets/fonts/inter-latin-wght-normal.woff2" as="font"
          type="font/woff2" crossorigin/>
    <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Cabecera -->
<header class="w-full top-0 sticky bg-surface shadow-sm z-50">
    <div class="flex justify-between items-center gap-4 px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto">
        <h1 class="flex items-baseline gap-3 min-w-0">
            <span class="text-headline-md font-headline-md font-black text-primary">PintaPost</span>
            <span class="hidden sm:block font-body-sm text-body-sm text-outline truncate">Formato que LinkedIn no borra</span>
        </h1>
        <div class="flex items-center gap-1 shrink-0">
            <button class="icon-button" type="button" id="theme-toggle"
                    aria-label="Activar modo oscuro" title="Cambiar tema">
                <svg class="w-5 h-5" aria-hidden="true"><use id="theme-toggle-icon" href="/static/assets/icons.svg#moon"></use></svg>
            </button>
            <a class="icon-button" href="https://github.com/ffelipecuevasc/pintapost"
               target="_blank" rel="noopener noreferrer"
               aria-label="Código fuente en GitHub (se abre en una pestaña nueva)"
               title="Código fuente en GitHub">
                <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#github"></use></svg>
            </a>
        </div>
    </div>
</header>
<!-- Área de trabajo -->
<div class="flex-1 flex flex-col md:flex-row w-full max-w-container-max mx-auto">
    <!-- Contenido principal -->
    <main class="flex-1 flex flex-col items-center px-margin-mobile md:px-gutter py-8 md:py-12 md:overflow-y-auto">
        <div class="w-full max-w-[720px] flex flex-col gap-6">
            <!-- Tarjeta del editor -->
            <section
                    class="card flex flex-col">
                <!-- Barra de herramientas. `data-command` es lo que conecta
                     cada botón con su comando en editor.js; el editor sincroniza
                     aria-pressed y data-state con la selección. -->
                <div class="flex items-center gap-1 p-3 border-b border-outline-variant/30 bg-surface-bright rounded-t-xl overflow-x-auto no-scrollbar"
                     id="toolbar" role="toolbar" aria-label="Formato de texto">
                    <button class="icon-button" type="button" aria-pressed="false"
                            data-command="bold"
                            aria-label="Negrita" title="Negrita (Ctrl+B)">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#bold"></use></svg>
                    </button>
                    <button class="icon-button" type="button" aria-pressed="false"
                            data-command="italic"
                            aria-label="Cursiva" title="Cursiva (Ctrl+I)">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#italic"></use></svg>
                    </button>
                    <button class="icon-button" type="button" aria-pressed="false"
                            data-command="underline"
                            aria-label="Subrayado" title="Subrayado (Ctrl+U)">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#underline"></use></svg>
                    </button>
                    <button class="icon-button" type="button" aria-pressed="false"
                            data-command="strikethrough"
                            aria-label="Tachado" title="Tachado">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#strikethrough"></use></svg>
                    </button>
                    <div class="w-px h-6 shrink-0 bg-outline-variant/50 mx-1" role="separator" aria-orientation="vertical"></div>
                    <button class="icon-button" type="button"
                            data-command="bullet"
                            aria-label="Lista con viñetas" title="Lista con viñetas">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#list-bulleted"></use></svg>
                    </button>
                    <button class="icon-button" type="button"
                            data-command="numbered"
                            aria-label="Lista numerada" title="Lista numerada">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#list-numbered"></use></svg>
                    </button>
                    <div class="w-px h-6 shrink-0 bg-outline-variant/50 mx-1" role="separator" aria-orientation="vertical"></div>
                    <button class="icon-button" type="button"
                            data-command="clear"
                            aria-label="Limpiar formato" title="Limpiar formato">
                        <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#clear-format"></use></svg>
                    </button>
                </div>
                <!-- Zona con aspecto de publicación de LinkedIn -->
                <div class="p-6 flex flex-col gap-4">
                    <!-- Cabecera de autor simulada (germen de la vista previa, C-02) -->
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
                            <svg class="w-6 h-6 text-outline" aria-hidden="true"><use href="/static/assets/icons.svg#person"></use></svg>
                        </div>
                        <div>
                            <div class="font-body-md text-body-md font-semibold text-on-surface leading-tight">Tu
                                Nombre
                            </div>
                            <div class="font-body-sm text-body-sm text-outline leading-tight">Tu Titular Profesional •
                                1er
                            </div>
                            <div class="flex items-center gap-1 font-label-sm text-label-sm text-outline mt-0.5">
                                <span>Justo ahora</span>
                                <span>•</span>
                                <svg class="w-3.5 h-3.5" aria-hidden="true"><use href="/static/assets/icons.svg#globe"></use></svg>
                            </div>
                        </div>
                    </div>
                    <!-- Área editable. Arranca con is-empty para que el
                         marcador de posición se vea antes de que corra el JS. -->
                    <div class="w-full min-h-[200px] outline-none font-body-md text-body-md text-on-surface whitespace-pre-wrap is-empty"
                         id="editor"
                         contenteditable="true"
                         role="textbox"
                         aria-multiline="true"
                         aria-label="Editor de publicación"
                         spellcheck="true"
                         lang="es"
                         data-placeholder="¿De qué quieres hablar? Empieza a escribir tu post aquí..."></div>
                </div>
            </section>
            <!-- Pie de acciones -->
            <div class="flex justify-end pt-4">
                <button class="flex items-center gap-2 bg-primary text-on-primary px-8 py-3 rounded-lg font-label-md text-label-md hover:brightness-110 shadow-sm transition-all active:scale-95"
                        type="button">
                    <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#copy"></use></svg>
                    Copiar para LinkedIn
                </button>
            </div>
        </div>
    </main>
    <!-- Panel de utilidades. Va DESPUÉS del <main> en el DOM para que en móvil
         caiga bajo el editor sin trucos; en escritorio md:order-first lo
         devuelve a la izquierda. Las tres secciones son cascarones: se llenan
         en S05 (contador) y S06 (borradores y vista previa). -->
    <aside class="w-full bg-surface-container-low border-t border-outline-variant md:order-first md:w-64 md:shrink-0 md:self-start md:sticky md:top-[73px] md:h-[calc(100vh-73px)] md:overflow-y-auto md:border-t-0 md:border-r"
           aria-label="Utilidades">
        <details class="group panel-details" open>
            <summary class="md:hidden flex items-center justify-between gap-2 list-none cursor-pointer select-none px-margin-mobile py-4 font-label-md text-label-md text-on-surface-variant transition-colors hover:text-primary">
                Utilidades
                <svg class="w-5 h-5 shrink-0 transition-transform group-open:rotate-180" aria-hidden="true"><use href="/static/assets/icons.svg#chevron-down"></use></svg>
            </summary>
            <div class="flex flex-col gap-8 px-margin-mobile pb-6 md:p-6">
                <section>
                    <h2 class="text-label-sm font-label-sm text-outline uppercase tracking-wider mb-2">Caracteres</h2>
                    <p class="font-body-sm text-body-sm text-outline">Contará el texto plano y el que acaba pegado en LinkedIn.</p>
                </section>
                <section>
                    <h2 class="text-label-sm font-label-sm text-outline uppercase tracking-wider mb-2">Borradores</h2>
                    <p class="font-body-sm text-body-sm text-outline">Aún no hay borradores.</p>
                </section>
                <section>
                    <h2 class="text-label-sm font-label-sm text-outline uppercase tracking-wider mb-2">Vista previa</h2>
                    <p class="font-body-sm text-body-sm text-outline">Mostrará el corte de «…ver más» de LinkedIn.</p>
                </section>
                <div class="pt-6 border-t border-outline-variant/30">
                    <a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors"
                       href="#">Política de privacidad</a>
                </div>
            </div>
        </details>
    </aside>
</div>
<script type="module" src="/static/js/main.js" defer></script>
</body>
</html>
