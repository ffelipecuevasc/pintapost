<?xml version="1.0" encoding="UTF-8"?>
<!--
  PintaPost — sprite de iconos (ADR-010)

  Uso:
    <svg class="w-5 h-5" aria-hidden="true"><use href="/static/assets/icons.svg#bold"></use></svg>

  Convenciones:
    - viewBox 0 0 24 24 en todos los símbolos
    - trazo de 1.75, sin relleno, currentColor
    - remate y unión redondeados
  El color lo hereda del contenedor vía currentColor, así que las clases
  text-* de Tailwind funcionan igual que con la fuente de iconos anterior.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="bold" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 5h6.5a3.5 3.5 0 0 1 0 7H7z"/>
    <path d="M7 12h7.5a3.5 3.5 0 0 1 0 7H7z"/>
  </symbol>

  <symbol id="italic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 5h-7"/>
    <path d="M13 19H6"/>
    <path d="M14.5 5 9.5 19"/>
  </symbol>

  <symbol id="underline" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4v6a5 5 0 0 0 10 0V4"/>
    <path d="M5 20h14"/>
  </symbol>

  <symbol id="strikethrough" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/>
    <path d="M8 8.5A3.5 3.5 0 0 1 11.5 5h1.5c1.7 0 3 .9 3.5 2.3"/>
    <path d="M7.5 15.5c.4 2 2.1 3.5 4.5 3.5h1c2.2 0 3.9-1.3 3.9-3.2 0-1.4-.8-2.4-2.2-3"/>
  </symbol>

  <symbol id="list-bulleted" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 6h11"/>
    <path d="M9 12h11"/>
    <path d="M9 18h11"/>
    <circle cx="4.5" cy="6" r="1.25" fill="currentColor" stroke="none"/>
    <circle cx="4.5" cy="12" r="1.25" fill="currentColor" stroke="none"/>
    <circle cx="4.5" cy="18" r="1.25" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="list-numbered" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 6h10"/>
    <path d="M10 12h10"/>
    <path d="M10 18h10"/>
    <path d="M3.5 4.5 5 4v4"/>
    <path d="M3.5 10.5h2.2L3.5 14h2.5"/>
    <path d="M3.5 16.5h2.2L4.5 18h.6a1.2 1.2 0 1 1 0 2.4H3.6"/>
  </symbol>

  <symbol id="clear-format" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 5h11"/>
    <path d="M13.5 5 9 19"/>
    <path d="M4 4 20 20"/>
  </symbol>

  <symbol id="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11" height="11" rx="2.5"/>
    <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-7A2.5 2.5 0 0 0 3 5.5v7A2.5 2.5 0 0 0 5.5 15"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m5 12.5 4.5 4.5L19 7"/>
  </symbol>

  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
  </symbol>

  <symbol id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5"/>
  </symbol>

  <symbol id="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9.5 6 6 6-6"/>
  </symbol>

  <symbol id="person" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.75"/>
    <path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
  </symbol>

  <symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18"/>
    <path d="M12 3a13.5 13.5 0 0 1 0 18a13.5 13.5 0 0 1 0-18"/>
  </symbol>

  <symbol id="document" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
    <path d="M14 3v5h5"/>
  </symbol>

  <symbol id="github" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 19c-4.5 1.5-4.5-2.5-6.5-3m13 5v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7a5.2 5.2 0 0 0-1.4-3.6 4.9 4.9 0 0 0-.1-3.6s-1.2-.3-3.8 1.4a13 13 0 0 0-7 0C5.9 1.8 4.7 2.1 4.7 2.1a4.9 4.9 0 0 0-.1 3.6A5.2 5.2 0 0 0 3.2 9.4c0 5.2 3.2 6.4 6.2 6.7a3.4 3.4 0 0 0-.9 2.6V23"/>
  </symbol>

</svg>
